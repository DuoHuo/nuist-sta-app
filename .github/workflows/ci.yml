name: Flutter CI

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    if: "!startsWith(github.event.head_commit.message, 'chore(release)') && !startsWith(github.event.pull_request.title, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # mini_apps/<app>/ 只能 import lib/core/ 和第三方包，见 CONTRIBUTING.md「依赖方向」
      - name: Check dependency direction
        run: |
          fail=0
          while IFS= read -r file; do
            app=$(cut -d/ -f3 <<<"$file")
            dir=$(dirname "$file")
            while IFS= read -r uri; do
              case "$uri" in
                dart:*) continue ;;
                package:nuist_sta_app/*) target="lib/${uri#package:nuist_sta_app/}" ;;
                package:*) continue ;;
                *) target=$(realpath -m --relative-to=. "$dir/$uri") ;;
              esac
              case "$target" in
                lib/core/*|"lib/mini_apps/$app/"*) ;;
                *)
                  echo "::error file=$file::小程序 $app 不能依赖 $target（只能 import lib/core/ 和第三方包）"
                  fail=1
                  ;;
              esac
            done < <(sed -nE "s/^[[:space:]]*(import|export|part)[[:space:]]+['\"]([^'\"]+)['\"].*/\2/p" "$file")
          done < <(find lib/mini_apps -mindepth 2 -name '*.dart')
          exit "$fail"

      # 敏感字面量守卫：正则刻意写成通用形式，避免守卫脚本自身泄露真实值。
      - name: Check for sensitive literals
        run: |
          set -euo pipefail
          fail=0
          scan() {
            local label="$1"
            local pattern="$2"
            local allow="${3:-}"
            local hits
            hits=$(grep -rInE "$pattern" lib test assets android ios native docs \
              README.md AGENTS.md CONTRIBUTING.md 2>/dev/null || true)
            if [ -n "$allow" ]; then
              hits=$(printf '%s\n' "$hits" | grep -vE "$allow" || true)
            fi
            if [ -n "$hits" ]; then
              echo "::error::$label"
              printf '%s\n' "$hits"
              fail=1
            fi
          }
          # 校内域名（不得明文，统一 hex 编码在 campus_config.dart）
          scan "发现 *.edu.cn 域名，应改用 CampusHosts + hex 配置" \
            '\.[a-z0-9-]+\.edu\.cn'
          # 校园网 IP（202.19x.y.z）
          scan "发现 202.19x 校园网 IP，应改用 CampusHosts + hex 配置" \
            '\b202\.1[0-9]{2}\.[0-9]'
          # 私钥：BEGIN 行后面必须跟着 base64，passkey_transfer 里的 PEM 头模板不算
          pem_hits=$(grep -rInA1 'BEGIN [A-Z ]*PRIVATE KEY' lib test assets android ios native docs \
            README.md AGENTS.md CONTRIBUTING.md 2>/dev/null | grep -E '[A-Za-z0-9+/]{32}' || true)
          if [ -n "$pem_hits" ]; then
            echo "::error::发现明文私钥"
            printf '%s\n' "$pem_hits"
            fail=1
          fi
          # 硬编码的导出密钥
          scan "发现硬编码的通行密钥导出密钥" \
            "_appKey[[:space:]]*=[[:space:]]*'"
          # 12 位学号（合成夹具白名单除外）
          scan "发现疑似真实学号，测试数据必须脱敏" \
            '\b[0-9]{12}\b' \
            '202512340001'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
      # 启动图标必须由 assets/images/app_icon.png 经 flutter_launcher_icons 生成，且已提交。
      - name: Check launcher icons
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          if ! git diff --exit-code -- android/app/src/main/res \
            || [ -n "$(git status --porcelain -- android/app/src/main/res)" ]; then
            git status --porcelain -- android/app/src/main/res
            echo "::error::启动图标与源图不一致，请运行 dart run flutter_launcher_icons 并提交 android/app/src/main/res 下的改动"
            exit 1
          fi

      # 在 crate 目录执行，让 rustup 按 rust-toolchain.toml 安装固定工具链和 Android target。
      - name: Set up Rust
        working-directory: native/vpn
        run: |
          rustup show
          cargo --version

      - name: Test Rust VPN core
        working-directory: native/vpn
        run: cargo test --locked --target-dir ../../build/rust-host

      - name: Build host VPN library for FFI tests
        working-directory: native/vpn
        run: cargo build --locked --target-dir ../../build/rust-host

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run tests
        run: flutter test --dart-define=VPN_NATIVE_LIBRARY=${{ github.workspace }}/build/rust-host/debug/libnuist_vpn.so

      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
