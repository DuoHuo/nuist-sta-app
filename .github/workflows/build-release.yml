name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v0.0.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "$RELEASE_SHA^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="$PREVIOUS_TAG..$RELEASE_SHA"
          else
            RANGE="$RELEASE_SHA"
          fi

          {
            printf '# %s\n\n' "$RELEASE_TAG"
            if [ -n "$PREVIOUS_TAG" ]; then
              printf '_Changes since %s._\n\n' "$PREVIOUS_TAG"
            else
              printf '_Initial release._\n\n'
            fi

            declare -A sections=(
              [Features]=""
              [Fixes]=""
              [Documentation]=""
              [Other Changes]=""
            )

            while IFS=$'\t' read -r subject short_sha author; do
              [ -n "$subject" ] || continue
              case "$subject" in
                feat:*|feat\([^)]*\):*|feature:*|feature\([^)]*\):*) section="Features" ;;
                fix:*|fix\([^)]*\):*|bugfix:*|bugfix\([^)]*\):*) section="Fixes" ;;
                docs:*|docs\([^)]*\):*|doc:*|doc\([^)]*\):*) section="Documentation" ;;
                refactor:*|refactor\([^)]*\):*|perf:*|perf\([^)]*\):*) section="Other Changes" ;;
                *) section="Other Changes" ;;
              esac
              sections["$section"]+="- $subject (\`$short_sha\`, @$author)"$'\n'
            done < <(git log --pretty=format:'%s%x09%h%x09%an' "$RANGE")

            for section in "Features" "Fixes" "Documentation" "Other Changes"; do
              if [ -n "${sections[$section]}" ]; then
                printf '## %s\n\n%s\n' "$section" "${sections[$section]}"
              fi
            done
          } > release-notes.md

          printf 'RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DH_SIGNING_KEY_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Read Keystore Alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.DH_KEYSTORE_PASSWORD }}
        run: |
          KEY_ALIAS="$(keytool -list -v -keystore release.jks -storepass "$KEYSTORE_PASSWORD" | sed -n 's/^Alias name: //p' | head -n 1)"
          test -n "$KEY_ALIAS"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          APP_ID_SUFFIX: ''
          SIGNING_KEY_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.DH_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Rename Release APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/NUIST-STA-${RELEASE_TAG}-android-arm64.apk"

      - name: Clean up Keystore
        if: always()
        run: rm -f release.jks

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: build/app/outputs/flutter-apk/NUIST-STA-${{ env.RELEASE_TAG }}-android-arm64.apk
