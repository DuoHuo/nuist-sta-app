name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DH_SIGNING_KEY_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Read Keystore Alias
        env:
          KEYSTORE_PASSWORD: ${{ secrets.DH_KEYSTORE_PASSWORD }}
        run: |
          KEY_ALIAS="$(keytool -list -v -keystore release.jks -storepass "$KEYSTORE_PASSWORD" | sed -n 's/^Alias name: //p' | head -n 1)"
          test -n "$KEY_ALIAS"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          APP_ID_SUFFIX: ''
          SIGNING_KEY_PATH: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.DH_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Clean up Keystore
        if: always()
        run: rm -f release.jks

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk
