<!doctype html>
<!-- Uses OpenDocument.core 7.7.0 under MPL-2.0. Source and notices: odr/NOTICE.txt. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: #f3f4f6; }
    body.dark { background: #15161a; color: #eee; color-scheme: dark; }
    select { font: inherit; min-height: 42px; margin: 8px; }
    main { position: relative; display: flex; flex: 1; min-height: 0; }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    #message { position: absolute; inset: 0; display: grid; place-items: center;
      padding: 16px; text-align: center; background: inherit; pointer-events: none; }
    [hidden] { display: none !important; }
  </style>
  <script src="viewer.js" defer></script>
</head>
<body>
  <select id="views" aria-label="选择工作表或幻灯片" hidden></select>
  <main>
    <iframe id="document" title="Office 附件内容" sandbox="allow-same-origin"></iframe>
    <div id="message" role="status" hidden></div>
  </main>
</body>
</html>
